[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiinfrakb"
version = "0.1.0"
description = "AI 推理优化知识库"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
# mcp 2.x 把 FastMCP 改名为 MCPServer，且 call_tool 返回值形状不同。
# kb_mcp 与 tests/test_mcp.py 仍走 1.x，锁在官方维护分支。
dev = ["pytest>=7", "mcp>=1.28,<2"]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
kb = "kb:main"
kb-mcp = "kb_mcp:main"

[tool.setuptools]
py-modules = ["kb", "kb_mcp"]

[tool.setuptools.package-dir]
"" = "tools"
