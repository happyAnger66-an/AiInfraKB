meta:
  id: forge-platform
  layer: platform
  author: agent:QA测试/box
  product: model_forge
  updated: 2026-10-17
cases:
  - id: G10
    title: FP8 recipe defaults extreme quant checked
    assert: |
      For FP8/NVFP4 templates, create-job UI forces 极致量化 (calib) checked
      and not cancellable when template requires_calib / fp8_gemm.
      API creates must still include calib when requires_calib / SoftAdd+C1.
    gate: requires_calib implied for FP8 SoftAdd+C1
  - id: G11
    title: Quant pipeline defaults to compare
    assert: |
      Quant templates default auto_compare=true (or stages include compare).
      Gate overall cos>0.999 AND mse<0.0005.
      Default compare.mode=glue (ckpt glue/PT reference); p3_dump not required.
  - id: P-login
    title: QA account login on test stack
    assert: qa_e2e local login; never use production :8088 for GR00T test stack; password never committed
  - id: P-submitter
    title: Jobs submitted as qa_e2e
    assert: submitter visible as qa_e2e for attribution
  - id: P-issue-loop
    title: Fix then new-open (never refresh failed job)
    assert: |
      After Agent/compile/ops marks DONE, QA creates a NEW job (new alias/id).
      Failed jobs stay as evidence; do not re-run/refresh them to greenwash.
  - id: P-api-vs-ui
    title: API coverage ≠ UI coverage
    assert: |
      Service/agent API PASS does not close web UI cases. UI smoke (entry→create→logs/artifacts)
      is recorded separately after the test-stack web image includes the feature entry.
  - id: P-ui-accuracy
    title: Numeric gate PASS is not a green UI Tag
    assert: |
      Job succeeded and overall cos>0.999 AND mse<0.0005 do not close the case.
      UI list must not show a false yellow Tag (e.g. cosine missing) and compare
      detail must show overall metrics. User path: list Tag, compare detail, and
      same-job latency when a bench exists. API-green alone does not close.
      Norms N1 and N3 in skills/ui-accuracy-presentation-gate.md.
  - id: P-key-alias
    title: Artifact keys alias-map to platform keys
    assert: |
      Artifact metric keys must alias-map to the keys the platform reads
      (e.g. overall.cos ↔ overall.cosine). Missing alias is FAIL even when
      the numeric gate PASSes. Norm N2 in skills/ui-accuracy-presentation-gate.md.
